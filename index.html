<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금을 만들자 | Let's Make Gold</title>
    <style>
        :root {
            --gold-primary: #ffd700;
            --gold-dark: #b8860b;
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--gold-primary);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold-primary);
        }

        .lang-switch {
            background-color: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .lang-switch:hover {
            background-color: var(--gold-primary);
            color: var(--bg-color);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            color: #000;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid #333;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" id="logo">금을 만들자</div>
        <button class="lang-switch" id="langBtn" onclick="toggleLanguage()">English</button>
    </header>

    <main>
        <h1 id="title">금을 만들자</h1>
        <p id="description">연금술의 비밀을 풀어 직접 금을 제작해보세요. 클릭 한 번으로 당신만의 자산을 늘려가는 즐거운 경험을 시작합니다!</p>
        <button class="btn-gold" id="actionBtn" onclick="makeGold()">금 연성하기</button>
    </main>

    <footer>
        <p id="footerText">&copy; 2026 금을 만들자 (Let's Make Gold). All rights reserved.</p>
    </footer>

    <script>
        let currentLang = 'ko';

        const i18n = {
            ko: {
                logo: "금을 만들자",
                title: "금을 만들자",
                description: "연금술의 비밀을 풀어 직접 금을 제작해보세요. 클릭 한 번으로 당신만의 자산을 늘려가는 즐거운 경험을 시작합니다!",
                actionBtn: "금 연성하기",
                langBtn: "English",
                goldCreated: "금 1g이 만들어졌습니다!"
            },
            en: {
                logo: "Let's Make Gold",
                title: "Let's Make Gold",
                description: "Unlock the secrets of alchemy and craft your own gold. Start the fun experience of growing your wealth with a single click!",
                actionBtn: "Craft Gold",
                langBtn: "한국어",
                goldCreated: "1g of Gold created!"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            document.getElementById('logo').innerText = i18n[currentLang].logo;
            document.getElementById('title').innerText = i18n[currentLang].title;
            document.getElementById('description').innerText = i18n[currentLang].description;
            document.getElementById('actionBtn').innerText = i18n[currentLang].actionBtn;
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
        }

        function makeGold() {
            alert(i18n[currentLang].goldCreated);
        }
    </script>
</body>
</html>
