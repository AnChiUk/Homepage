<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h1>페이지 이동 메뉴</h1>
    <p>아래 버튼을 누르면 해당 페이지로 이동합니다.</p>

    <a href="index1.html" class="btn">Index 1 페이지로 이동</a>

    <a href="index2.html" class="btn btn-green">Index 2 페이지로 이동</a>
</body>
</html>
